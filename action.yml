name: 'basic-ops-tasks'
description: >-
  Keep a fork up to date with its upstream (parent) repository, or sync one
  branch into another within a repository, by opening a pull request that
  carries the incoming commits. Or verify that a requirements.txt-like file's
  libraries and versions exist on a Python package index.
author: 'ruivieira'

branding:
  icon: 'git-merge'
  color: 'purple'

inputs:
  mode:
    description: >-
      Which task to run. "fork": pull from an upstream repository into this
      one. "branch": sync "source-branch" into "target-branch" within this
      repository. "python-index": verify that every library and version named
      in "requirements-file" exists on "index-url". "auto" (default): branch
      mode when "source-branch" is set, fork mode otherwise.
    required: false
    default: 'auto'
  token:
    description: >-
      Token used to read repository info, push the sync branch and open the
      pull request. Needs contents:write and pull-requests:write on the fork.
    required: false
    default: ${{ github.token }}
  upstream-repo:
    description: >-
      Upstream repository to pull from, as "owner/name". Default: the parent of
      the repository the action runs in.
    required: false
    default: ''
  upstream-branch:
    description: >-
      Branch on the upstream repository to pull from. Default: the upstream
      default branch.
    required: false
    default: ''
  source-branch:
    description: >-
      Branch-to-branch mode: sync this branch of the current repository into
      "target-branch" instead of syncing from an upstream. Cannot be combined
      with upstream-repo/upstream-branch.
    required: false
    default: ''
  target-branch:
    description: >-
      Branch on the fork that receives the changes (the pull request base).
      Default: the fork default branch.
    required: false
    default: ''
  head-branch:
    description: >-
      Branch on the fork that carries the changes (the pull request head).
      Must be in the reserved sync/ namespace. Default: "sync/<identity-sha256>",
      derived from mode, destination repository, upstream repository, source
      branch and target branch. Existing heads require matching PR identity
      or explicit allow-head-update.
    required: false
    default: ''
  allow-head-update:
    description: >-
      Explicitly adopt/update an existing sync/ head without a matching open PR
      carrying this sync identity. Required for repeated skip-pr runs. Updates
      still use force-with-lease. Only enable for a branch dedicated to this sync.
    required: false
    default: 'false'
  merge-strategy:
    description: >-
      "merge" (default): merge upstream into the target branch, fast-forwarding
      when possible. "tip": check mergeability, then point the head branch at upstream's tip.
      Both strategies report conflicts; unexpected Git errors fail closed.
    required: false
    default: 'merge'
  fail-on-conflict:
    description: >-
      Fail before pushing or modifying a pull request when the merge conflicts.
    required: false
    default: 'false'
  upstream-token:
    description: >-
      Token used to fetch from the upstream repository. Only needed when the
      upstream repository is private and the main token cannot read it.
      Default: same as token.
    required: false
    default: ''
  pr-title:
    description: >-
      Title for the pull request. Default: "sync(pull): Sync <upstream>:<branch>
      (upstream) into <target>" in fork mode, "sync(branch): Sync <source> into
      <target>" in branch mode.
    required: false
    default: ''
  pr-body:
    description: >-
      Body for the pull request. Default: a summary with the incoming commits
      and a warning banner when there are conflicts.
    required: false
    default: ''
  labels:
    description: 'Comma-separated labels to add to the pull request.'
    required: false
    default: ''
  assignees:
    description: 'Comma-separated GitHub usernames to assign the pull request to.'
    required: false
    default: ''
  dry-run:
    description: 'Run the sync logic but push nothing and open no pull request.'
    required: false
    default: 'false'
  skip-pr:
    description: 'Push the sync branch but do not open a pull request.'
    required: false
    default: 'false'
  requirements-file:
    description: >-
      "python-index" mode: path to the requirements.txt-like file to verify.
      Relative paths resolve against GITHUB_WORKSPACE. The file and every
      -r/-c include must resolve (after symlinks) inside GITHUB_WORKSPACE.
      Supports name/extras, PEP 440 specifiers, environment markers, -r/-c
      includes and --pre. --index-url/--extra-index-url lines are ignored: the
      index comes from the action inputs.
    required: false
    default: 'requirements.txt'
  index-url:
    description: >-
      "python-index" mode: base URL of the PEP 503 simple index, for example
      https://pypi.org/simple or a devpi/Artifactory/Nexus mirror. This is the
      only source of index URLs and the only network destination: --index-url
      and --extra-index-url lines in the requirements file are ignored, URL
      requirements fail without being fetched, and no authentication is sent.
    required: false
    default: 'https://pypi.org/simple'
  extra-index-urls:
    description: >-
      "python-index" mode: comma-separated additional simple index URLs. Like
      index-url, these are action parameters only; credentials are rejected.
    required: false
    default: ''
  allow-prerelease:
    description: >-
      "python-index" mode: accept pre-release versions even when a stable
      version would otherwise be required. The file's --pre option enables it
      as well. Pre-releases are accepted when no stable version matches.
    required: false
    default: 'false'
  timeout-seconds:
    description: '"python-index" mode: per-request HTTP timeout in seconds.'
    required: false
    default: '30'
  python-version:
    description: >-
      "python-index" mode: target Python version used to evaluate PEP 508
      environment markers, for example "3.12.7" (a bare "3.12" works but makes
      python_full_version comparisons imprecise). When empty, markers are not
      evaluated and every requirement is checked.
    required: false
    default: ''
  platform:
    description: >-
      "python-index" mode: target sys_platform for marker evaluation: linux
      (default), darwin or win32.
    required: false
    default: 'linux'
  platform-machine:
    description: >-
      "python-index" mode: target platform_machine for marker evaluation, for
      example x86_64 or aarch64. Default: derived from the runner architecture.
    required: false
    default: ''

outputs:
  status:
    description: '"up-to-date", "synced" or "conflicts" (sync modes).'
  pull-request-number:
    description: 'Number of the opened/updated pull request (empty when none).'
  pull-request-url:
    description: 'URL of the opened/updated pull request (empty when none).'
  head-sha:
    description: 'SHA of the head branch produced by this run.'
  target-sha:
    description: 'SHA of the target branch before the sync.'
  upstream-sha:
    description: 'SHA of the upstream branch that was synced.'
  commit-count:
    description: 'Number of commits the pull request brings in.'
  pushed:
    description: '"true" when the head branch was pushed to the fork.'
  checked-count:
    description: '"python-index" mode: number of requirements inspected.'
  failed-count:
    description: '"python-index" mode: requirements missing or failing to resolve.'
  skipped-count:
    description: >-
      "python-index" mode: requirements skipped (local paths, editables, or an
      unsatisfied environment marker).

runs:
  using: 'node24'
  main: 'dist/index.js'
